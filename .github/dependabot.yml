version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    # These expose Tauri's raw WebView2 types. Upgrade them together with Tauri,
    # whose current Windows dependency graph uses webview2-com 0.39 / windows 0.62.
    ignore:
      - dependency-name: webview2-com
        update-types: ['version-update:semver-minor']
      - dependency-name: windows
        update-types: ['version-update:semver-minor']
    groups:
      # Review stable Tauri components together instead of opening one PR per crate.
      tauri-minor-and-patch:
        applies-to: version-updates
        patterns: ['tauri', 'tauri-*']
        update-types:
          - minor
          - patch
      # Cargo 0.x minor releases may contain breaking API changes, so only patches are grouped.
      rust-patches:
        applies-to: version-updates
        patterns: ['*']
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types:
          - minor
          - patch
