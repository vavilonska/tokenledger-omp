[package]
name = "tokenledger-omp"
version = "0.5.4"
description = "Cross-platform AI quota tracker"
authors = ["OpenQuota contributors", "TokenLedger OMP contributors"]
edition = "2021"

[lib]
name = "tokenledger_omp_lib"
# This fork targets the local Windows desktop app. The MinGW linker overflows the export ordinal
# table when producing the unused cdylib for the full Tauri graph; the desktop binary links rlib.
crate-type = ["rlib"]

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
notify-rust = "4.18.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "rustls"] }
regex = "1"
roxmltree = "0.21"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
svgtypes = "0.16"
# Uses Tauri's raw WebView2 handle; verify the Windows WebView2 dependencies when upgrading Tauri.
tauri = { version = "~2.12.0", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
# Keep the pre-2.12 feature set. Enabling system-proxy here also affects every
# reqwest client through Cargo feature unification, including loopback requests.
tauri-plugin-updater = { version = "2.12.0", default-features = false, features = ["rustls-tls", "zip"] }
tempfile = "3"
thiserror = "2"
tiny-skia = { version = "0.12", default-features = false, features = ["simd", "std"] }
tokio = { version = "1", features = ["sync", "time"] }
walkdir = "2"
zeroize = "1.8"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
# Keep these aligned with Tauri's raw WebView2 interface types. Minor upgrades of
# these 0.x crates require a coordinated Tauri upgrade (see Dependabot ignores).
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Globalization"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.1", default-features = false, features = ["rt-async-io-crypto-rust"] }
zbus = "5.13"

[dev-dependencies]
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
